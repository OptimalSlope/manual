# Configurations
title:            User Manual
longtitle:        OptimalSlope Manual
author:           Dainius Jenkus
email:            sighingnow@gmail.com
description: >
  Slope Optimiser user manual - automated open pit slope design

version:          1.0
gitbook_version:  3.2.3

url:              'https://OptimalSlope.github.io'
baseurl:          '/manual'
rss:              RSS

# bootstrap: use the remote theme for the site itself
remote_theme: sighingnow/jekyll-gitbook

toc:
  enabled: true
  h_min: 1
  h_max: 3

# customize the link favicon in header, will be {{site.baseurl}}/{{site.favicon_path}}
favicon_path:     /assets/gitbook/images/favicon.ico

# markdown render engine.
markdown:         kramdown
kramdown:
  auto_ids:               true
  input:                  GFM
  math_engine:            mathjax
  smart_quotes:           lsquo,rsquo,ldquo,rdquo
  toc_levels:             1..6
  syntax_highlighter:     rouge
  syntax_highlighter_opts:
    guess_lang:           true

syntax_highlighter_style: colorful

markdown_ext:             markdown,mkdown,mkdn,mkd,md

# Permalinks
permalink:                /:categories/:year-:month-:day-:title:output_ext

# Disqus comments
# disqushandler:            sighingnow

exclude:
  - _drafts
  - README_old.md
  - tools
  - kb
  - evals

collections:
  pages:
    output: true
    permalink: /:collection/:path/

page_width: 800px

# Manual assistant backend (manual-chat repo). Blank disables the widget.
# Cloudflare Web Analytics site token. Cookieless, so no consent banner is
# needed. Get it from the Cloudflare dashboard: Web Analytics > Add a site >
# copy the token out of the JS snippet. Blank disables the beacon entirely.
tracker:
  cloudflare_analytics: 'bff844be1faa458a8b4ecb7bd795fc2e'

chat_endpoint: 'https://zwtwkfvku4hd35srobpqqlkotm0fxfmt.lambda-url.us-east-2.on.aws/chat'

destination:      ./_site
incremental:      false
regenerate:       true

plugins:
  - jekyll-feed
  - jekyll-readme-index
  - jemoji
