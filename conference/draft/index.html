<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>OptimalSlope · Original demo with tutorial cases · TV draft</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#edf3f7}
    #tvViewport{width:100%;height:100%;overflow:auto;display:flex}
    #tvSizer{position:relative;flex-shrink:0;margin:auto;width:1600px;height:900px}
    #tvCanvas{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:top left;transform:scale(var(--tv-scale,1))}
    iframe{display:block;width:100%;height:100%;border:0}
  </style>
</head>
<body>
  <div id="tvViewport"><div id="tvSizer"><div id="tvCanvas"><iframe id="workflowFrame" src="../../assets/preview_interactive.html?conference=2026" title="OptimalSlope workflow and tutorial case studies" allow="fullscreen" allowfullscreen></iframe></div></div></div>
  <script>
    const frame = document.getElementById('workflowFrame');
    const sizer = document.getElementById('tvSizer');
    const canvas = document.getElementById('tvCanvas');
    // Browser zoom changes CSS viewport dimensions AND devicePixelRatio. Keep
    // that zoom effective instead of immediately fitting it away on resize.
    // Explicit Fit to screen establishes a new fit at the current browser zoom.
    let fitPixelRatio = devicePixelRatio || 1;
    let contentZoom = 1;
    function updateScale() {
      const browserZoom = (devicePixelRatio || 1) / fitPixelRatio;
      const fittedScale = Math.min(innerWidth / 1600, innerHeight / 900);
      const zoom = browserZoom * contentZoom;
      const scale = fittedScale * zoom;
      document.documentElement.style.setProperty('--tv-scale', String(scale));
      // Resize the document viewport inversely as well: zooming out reveals
      // more of the scrollable content, rather than just shrinking its window.
      canvas.style.width = `${1600 / zoom}px`;
      canvas.style.height = `${900 / zoom}px`;
      sizer.style.width = `${1600 * fittedScale}px`;
      sizer.style.height = `${900 * fittedScale}px`;
      frame.contentWindow.postMessage({type:'booth-view-scale', percent:Math.round(browserZoom * contentZoom * 100)}, location.origin);
    }
    addEventListener('resize', updateScale);
    addEventListener('message', event => {
      if(event.source !== frame.contentWindow || event.origin !== location.origin) return;
      const action = event.data?.type;
      if(action === 'booth-view-zoom') {
        if(event.data.direction !== 1 && event.data.direction !== -1) return;
        contentZoom = Math.max(.5, Math.min(2, contentZoom * (event.data.direction === 1 ? 1.1 : 1 / 1.1)));
      } else if(action === 'booth-view-fit') {
        fitPixelRatio = devicePixelRatio || 1;
        contentZoom = 1;
      } else if(action !== 'booth-view-ready') return;
      updateScale();
    });
    updateScale();
    if (location.search) {
      const url = new URL(frame.getAttribute('src'), location.href);
      for (const name of ['scene', 'paused']) {
        const value = new URLSearchParams(location.search).get(name);
        if (value !== null) url.searchParams.set(name, value);
      }
      frame.src = url.href;
    }
    frame.addEventListener('load', () => frame.focus());
  </script>
  <noscript>JavaScript is needed for automatic playback. <a href="../../assets/preview_interactive.html">Open the original demo.</a></noscript>
</body>
</html>
