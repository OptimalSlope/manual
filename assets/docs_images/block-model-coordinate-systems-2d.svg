<text x="800" y="91" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="26" font-weight="400" fill="#546B78">Changing the export coordinate system does not move the grid or its origin, or resize its blocks.</text>
