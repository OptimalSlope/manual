<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"><title>2D: one grid, two coordinate systems</title><desc>The same 5 by 3 grid of 20 m blocks. Local origin (0, 0) m; cross-section origin (100, 50) m. Axis ticks give X and Z coordinates in metres.</desc>
