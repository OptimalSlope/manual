<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"><title>3D block model coordinate systems</title><desc>The same 5 by 3 by 2 grid of 20 m blocks expressed in local and Ground Model coordinates. Z is vertical. The grid does not move.</desc>
