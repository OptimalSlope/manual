<text x="69" y="774" dominant-baseline="text-before-edge" font-family="Segoe UI, sans-serif" font-size="23" font-weight="400" fill="#163D50">First block centre = (110, 60) m — half a block from the origin along X and Z.</text>
<text x="69" y="813" dominant-baseline="text-before-edge" font-family="Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#546B78">Coordinates are shown as (X, Z). The origin does not have to be zero.</text></svg>